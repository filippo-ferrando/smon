name: CI

# Only run when something that affects the build or tests changes; docs, README,
# CHANGELOG, packaging and release scripts don't. internal/** is listed whole because
# it also holds embedded assets (index.html, sw.js) and the cgo sources. Keep both
# lists in sync.
on:
  push:
    branches: ["main"]
    paths:
      - "cmd/**"
      - "internal/**"
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".forgejo/workflows/ci.yml"
  pull_request:
    paths:
      - "cmd/**"
      - "internal/**"
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".forgejo/workflows/ci.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: docker
    container:
      image: archlinux:latest
    steps:
      # nodejs runs the actions; gstreamer + gst-plugins-base-libs are the cgo headers
      # internal/gst builds against.
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed base-devel go git nodejs gstreamer gst-plugins-base-libs

      - uses: actions/checkout@v7

      - name: Check (gofumpt, vet, staticcheck, short tests)
        run: make check

      - name: Build
        run: make build
