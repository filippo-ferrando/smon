<!doctype html>
<html lang="en" data-input="0" data-pen="0" data-keyboard="0" data-audio="0" data-codec="h264">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest?t={{TOKEN}}">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Second Monitor</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  video, canvas { width: 100vw; height: 100vh; object-fit: contain; display: block;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  canvas { display: none; }
  #msg { position: fixed; top: 8px; left: 8px; color: #ccc; font: 14px system-ui, sans-serif; pointer-events: none; }
  #bar { position: fixed; top: 8px; right: 8px; display: flex; gap: 8px; opacity: 0; pointer-events: none; transition: opacity .3s; }
  #bar.show { opacity: 1; pointer-events: auto; }
  #bar button { width: 44px; height: 44px; padding: 10px; border: 0; border-radius: 8px; background: rgba(40,40,40,.7); color: #eee; }
  #bar button[hidden] { display: none; }
  #stats { position: fixed; top: 60px; right: 8px; padding: 8px 10px; border-radius: 8px; background: rgba(0,0,0,.75);
    color: #d8f0d8; font: 12px/1.45 ui-monospace, monospace; white-space: pre; pointer-events: none; display: none; }
  #kbin { position: fixed; left: -1000px; top: 0; width: 10px; height: 10px; opacity: 0; }
  #trust { position: fixed; bottom: 8px; right: 8px; max-width: 22em; padding: 8px 10px; border-radius: 8px;
    background: rgba(40,40,40,.85); color: #ddd; font: 13px system-ui, sans-serif; display: none; }
  #trust a { color: #8cc4ff; }
  #snd { position: fixed; bottom: 8px; left: 8px; padding: 6px 10px; border-radius: 8px; background: rgba(40,40,40,.7);
    color: #eee; font: 14px system-ui, sans-serif; pointer-events: none; display: none; }
</style>
<video id="v" muted autoplay playsinline></video>
<audio id="a" muted autoplay></audio>
<canvas id="c"></canvas>
<div id="msg">connecting…</div>
<div id="snd">tap for sound</div>
<div id="trust">To install this viewer as an app, trust smon's certificate once:
  <a href="ca.crt">download it</a>, then install it in the device settings (see smon's docs). <a href="#" id="trustx">Dismiss</a></div>
<div id="stats"></div>
<textarea id="kbin" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-hidden="true"></textarea>
<div id="bar">
  <button id="inst" hidden aria-label="Install as an app"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></button>
  <button id="kb" hidden aria-label="Show the on-screen keyboard"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg></button>
  <button id="info" aria-label="Show stream stats"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button>
  <button id="fs" aria-label="Toggle fullscreen"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>
<script>
const INPUT = document.documentElement.dataset.input === '1';
const PEN = document.documentElement.dataset.pen === '1';
const KEYBOARD = document.documentElement.dataset.keyboard === '1';
const CODEC = document.documentElement.dataset.codec; // h264, h265 or av1
const AUDIO = document.documentElement.dataset.audio === '1';
const v = document.getElementById('v'), c = document.getElementById('c'), a = document.getElementById('a');
const msg = document.getElementById('msg'), fs = document.getElementById('fs'), bar = document.getElementById('bar');
let surface = v, send = null;

// --- reconnecting: back off from 1 s to 10 s while smon is down or restarting ---
let backoff = 1000;
// A refusal smon won't change its mind about (wrong token, unsupported codec): stop and say why.
class Fatal extends Error {}
function run(start) {
  start().catch(e => e instanceof Fatal ? msg.textContent = 'error: ' + e.message : retry(start, String(e.message || e)));
}
function retry(start, why) {
  msg.textContent = (why ? why + ' — ' : '') + 'reconnecting…';
  setTimeout(() => run(start), backoff);
  backoff = Math.min(backoff * 2, 10000);
}
const connected = () => { backoff = 1000; msg.textContent = ''; };

// --- which monitor ---
// smon may give each device a monitor of its own (-monitors). The client id
// stays in this browser, so a reload gets the same monitor back; ?m=N asks
// for monitor N, to watch it.
const CID = (() => {
  let id = null;
  try { id = localStorage.getItem('smon-cid'); } catch {}
  if (!id) {
    id = Array.from(crypto.getRandomValues(new Uint8Array(12)), b => b.toString(16).padStart(2, '0')).join('');
    try { localStorage.setItem('smon-cid', id); } catch {}
  }
  return id;
})();
const WANT = +new URLSearchParams(location.search).get('m') || 0;
async function claim() {
  const slow = setTimeout(() => { msg.textContent = 'setting up your monitor… (if a share dialog shows on the computer, allow it)'; }, 1500);
  let res;
  try {
    res = await fetch('/claim' + location.search, { method: 'POST', body: JSON.stringify({ cid: CID, m: WANT, portrait: innerHeight > innerWidth }) });
  } catch (e) { throw new Error('smon is not reachable'); }
  finally { clearTimeout(slow); }
  const text = await res.text();
  if (res.status === 403) throw new Fatal('this link is no longer valid (smon -new-token?): open the new URL smon prints');
  if (res.status === 404 || res.status === 409) throw new Fatal(text.trim());
  if (!res.ok) throw new Error(text.trim());
  return JSON.parse(text).m;
}

// --- WebRTC (LAN) ---
async function startRTC() {
  const mon = await claim();
  const pc = new RTCPeerConnection();
  pc.addTransceiver('video', { direction: 'recvonly' });
  if (AUDIO) pc.addTransceiver('audio', { direction: 'recvonly' });
  const ctl = pc.createDataChannel('ctl'); // smon's side of the stats
  ctl.onmessage = e => onServerMsg(e.data);
  rtcPC = pc;
  if (INPUT || KEYBOARD) {
    const dc = pc.createDataChannel('input');
    dc.onopen = () => send = m => dc.readyState === 'open' && dc.send(m);
    dc.onclose = () => send = null;
  }
  // Play out as soon as a frame decodes: the default jitter buffer adds tens of ms
  // and grows after any hiccup, which a LAN never needs back. Video and audio are
  // separate streams (and elements) so lip-sync never delays the picture.
  pc.ontrack = e => {
    if ('jitterBufferTarget' in e.receiver) e.receiver.jitterBufferTarget = 0;
    else if ('playoutDelayHint' in e.receiver) e.receiver.playoutDelayHint = 0;
    const el = e.track.kind === 'audio' ? a : v;
    el.srcObject = new MediaStream([e.track]);
  };
  let gone = false;
  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'connected') connected();
    if (!gone && ['failed', 'disconnected', 'closed'].includes(pc.connectionState)) {
      gone = true; send = null; pc.close(); retry(startRTC);
    }
  };
  await pc.setLocalDescription(await pc.createOffer());
  await new Promise(r => pc.iceGatheringState === 'complete' ? r() :
    pc.addEventListener('icegatheringstatechange', () => pc.iceGatheringState === 'complete' && r()));
  let res;
  try {
    const q = new URLSearchParams(location.search); q.set('m', mon); q.set('c', CID);
    res = await fetch('/offer?' + q, { method: 'POST', body: JSON.stringify(pc.localDescription) });
  } catch (e) { pc.close(); throw new Error('smon is not reachable'); }
  if (!res.ok) {
    const text = (await res.text()).trim();
    pc.close();
    if (res.status === 403) throw new Fatal('this link is no longer valid (smon -new-token?): open the new URL smon prints');
    if (res.status >= 400 && res.status < 500) throw new Fatal(text);
    // 503: the monitor closed since the claim; claim again.
    throw new Error(text);
  }
  await pc.setRemoteDescription(await res.json());
}

// --- WebSocket + WebCodecs (USB via adb reverse: TCP only, localhost is a secure context) ---
// The WebCodecs codec string. H.264 reads profile and level from the SPS;
// H.265 (Main) and AV1 (Main, 8-bit) name a level high enough for 4K60.
function codecFor(au) {
  if (CODEC === 'h265') return 'hvc1.1.6.L153.B0';
  if (CODEC === 'av1') return 'av01.0.13M.08';
  const h = n => n.toString(16).padStart(2, '0'); // avc1.PPCCLL
  for (let i = 0; i + 6 < au.length; i++)
    if (au[i] === 0 && au[i + 1] === 0 && au[i + 2] === 1 && (au[i + 3] & 0x1f) === 7)
      return 'avc1.' + h(au[i + 4]) + h(au[i + 5]) + h(au[i + 6]);
  return 'avc1.42e01f';
}
function startWS() {
  v.style.display = 'none'; c.style.display = 'block'; surface = c;
  const ctx = c.getContext('2d', { alpha: false, desynchronized: true }); // desynchronized: skip a compositor frame where supported
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws${location.search}`);
  ws.binaryType = 'arraybuffer';
  let dec = null, ts = 0, waitKey = true, codecChecked = false;
  ws.onopen = () => { if (INPUT || KEYBOARD) send = m => ws.readyState === 1 && ws.send(m); };
  // The periodic keyframe is seconds apart: ask for one whenever decoding has to restart.
  const needKey = () => { if (!waitKey && ws.readyState === 1) ws.send('{"t":"key"}'); waitKey = true; };
  ws.onmessage = e => {
    if (typeof e.data === 'string') { onServerMsg(e.data); return; } // stats
    wsBytes += e.data.byteLength;
    const b = new Uint8Array(e.data), key = (b[0] & 1) === 1, au = b.subarray(1);
    if (b[0] & 2) { playOpus(au); return; } // audio frame
    if (!dec || dec.state === 'closed') {
      if (!key) return;
      dec = new VideoDecoder({
        output: f => {
          if (c.width !== f.displayWidth || c.height !== f.displayHeight) { c.width = f.displayWidth; c.height = f.displayHeight; }
          ctx.drawImage(f, 0, 0); f.close(); wsFrames++; if (msg.textContent) connected();
        },
        error: err => { msg.textContent = 'decoder: ' + err.message; needKey(); },
      });
      const config = { codec: codecFor(au), optimizeForLatency: true };
      if (CODEC !== 'h264' && !codecChecked) { // can this browser decode it at all?
        codecChecked = true;
        VideoDecoder.isConfigSupported(config).then(r => {
          if (!r.supported) { msg.textContent = `error: this browser can't decode ${CODEC.toUpperCase()} video: restart smon with -codec h264`; ws.onclose = null; ws.close(); }
        }).catch(() => {});
      }
      dec.configure(config);
    }
    if (dec.decodeQueueSize > 3) needKey(); // falling behind: skip to the next keyframe
    if (waitKey && !key) return;
    waitKey = false;
    dec.decode(new EncodedVideoChunk({ type: key ? 'key' : 'delta', timestamp: ts += 33333, data: au }));
  };
  ws.onclose = () => {
    send = null;
    try { dec && dec.close(); } catch {}
    retry(async () => startWS());
  };
}

// --- stats overlay ---
const statsEl = document.getElementById('stats'), info = document.getElementById('info');
let rtcPC = null, server = null, wsFrames = 0, wsBytes = 0, prev = null, statsOn = false;
try { statsOn = localStorage.getItem('smon-stats') === '1'; } catch {}
function onServerMsg(text) {
  try { const m = JSON.parse(text); if (m.t === 'stats') server = m; } catch {}
}
info.onclick = () => {
  statsOn = !statsOn; statsEl.style.display = statsOn ? 'block' : 'none';
  try { localStorage.setItem('smon-stats', statsOn ? '1' : '0'); } catch {}
};
statsEl.style.display = statsOn ? 'block' : 'none';
// One line per measure; the browser's own numbers where it has them.
async function measure() {
  const now = performance.now(), out = {};
  if (surface === v && rtcPC) {
    const r = await rtcPC.getStats();
    r.forEach(s => {
      if (s.type === 'inbound-rtp' && s.kind === 'video') {
        out.bytes = s.bytesReceived; out.fps = s.framesPerSecond; out.lost = s.packetsLost; out.dropped = s.framesDropped;
        out.decoder = s.decoderImplementation; out.w = s.frameWidth; out.h = s.frameHeight;
        if (s.framesDecoded) out.decodeMs = 1000 * s.totalDecodeTime / s.framesDecoded;
        if (s.jitterBufferEmittedCount) out.bufferMs = 1000 * s.jitterBufferDelay / s.jitterBufferEmittedCount;
      }
      if (s.type === 'candidate-pair' && s.nominated && s.state === 'succeeded' && s.currentRoundTripTime !== undefined)
        out.rtt = 1000 * s.currentRoundTripTime;
    });
  } else {
    out.bytes = wsBytes; out.frames = wsFrames; out.w = c.width; out.h = c.height; out.decoder = 'WebCodecs';
  }
  if (prev) {
    const dt = (now - prev.now) / 1000;
    out.kbps = 8 * (out.bytes - prev.bytes) / 1000 / dt;
    if (out.frames !== undefined) out.fps = (out.frames - prev.frames) / dt;
  }
  prev = { now, bytes: out.bytes, frames: out.frames };
  return out;
}
const f0 = n => n === undefined || isNaN(n) ? '–' : Math.round(n);
setInterval(async () => {
  if (!statsOn) { prev = null; return; }
  let m = {};
  try { m = await measure(); } catch {}
  const lines = [];
  if (server) {
    if (server.mon) lines.push(`monitor  ${server.mon}`);
    lines.push(`encoder  ${server.enc || '?'} (${server.codec})`);
    lines.push(`stream   ${server.size} @ ${server.fps} fps`);
    lines.push(`bitrate  ${server.kbps} / ${server.max} kbps`);
    lines.push(`viewers  ${server.viewers}`);
  }
  lines.push(`received ${f0(m.kbps)} kbps, ${f0(m.fps)} fps`);
  if (m.w) lines.push(`decoded  ${m.w}x${m.h} by ${m.decoder || '?'}${m.decodeMs !== undefined ? `, ${m.decodeMs.toFixed(1)} ms/frame` : ''}`);
  if (m.rtt !== undefined) lines.push(`network  ${f0(m.rtt)} ms round trip`);
  if (m.bufferMs !== undefined) lines.push(`buffer   ${f0(m.bufferMs)} ms`);
  if (m.lost !== undefined) lines.push(`lost     ${m.lost} packets, ${m.dropped ?? 0} frames dropped`);
  statsEl.textContent = lines.join('\n');
}, 1000);

// --- sound ---
// Browsers start media silent until a user gesture: the first tap/click/key unlocks it.
// WebRTC plays through the <audio>; the WebSocket path decodes Opus with WebCodecs into an AudioContext.
const snd = document.getElementById('snd');
let actx = null, adec = null, aNext = 0, ats = 0;
function playOpus(frame) {
  if (!actx || actx.state !== 'running' || !('AudioDecoder' in window)) return;
  if (!adec || adec.state === 'closed') {
    adec = new AudioDecoder({
      output: d => {
        const buf = actx.createBuffer(d.numberOfChannels, d.numberOfFrames, d.sampleRate);
        for (let i = 0; i < d.numberOfChannels; i++) d.copyTo(buf.getChannelData(i), { planeIndex: i, format: 'f32-planar' });
        d.close();
        const now = actx.currentTime;
        if (aNext < now + 0.01 || aNext > now + 0.2) aNext = now + 0.05; // underrun or drift: re-anchor, bounded latency
        const s = actx.createBufferSource(); s.buffer = buf; s.connect(actx.destination); s.start(aNext);
        aNext += buf.duration;
      },
      error: () => { adec = null; },
    });
    adec.configure({ codec: 'opus', sampleRate: 48000, numberOfChannels: 2 });
  }
  adec.decode(new EncodedAudioChunk({ type: 'key', timestamp: ats += 10000, data: frame }));
}
function unlockSound() {
  if (!AUDIO) return;
  if (surface === v) { a.muted = false; a.play().catch(() => {}); }
  else { actx = actx || new AudioContext({ latencyHint: 'interactive', sampleRate: 48000 }); actx.resume(); }
  snd.style.display = 'none';
}
if (AUDIO) {
  snd.style.display = 'block';
  for (const t of ['pointerup', 'click', 'keydown']) window.addEventListener(t, unlockSound, true);
}

// --- touch and pen input ---
const down = new Set();
let penDown = false;
function onPointer(e) {
  showFs();
  const pen = e.pointerType === 'pen' && PEN;
  if (!INPUT) return;
  e.preventDefault();
  const w = surface === v ? v.videoWidth : c.width, h = surface === v ? v.videoHeight : c.height;
  if (!send || !w || !h) return;
  const r = surface.getBoundingClientRect(), s = Math.min(r.width / w, r.height / h); // object-fit: contain
  const x = (e.clientX - r.left - (r.width - w * s) / 2) / (w * s);
  const y = (e.clientY - r.top - (r.height - h * s) / 2) / (h * s);
  if (pen) { // a stylus: pressure, tilt, hover, eraser and side buttons
    let t;
    if (e.type === 'pointerdown') {
      if (x < 0 || x > 1 || y < 0 || y > 1) return;
      surface.setPointerCapture(e.pointerId); penDown = true; t = 'd';
    } else if (e.type === 'pointermove') t = penDown ? 'm' : 'h';
    else if (e.type === 'pointerup') { penDown = false; t = 'u'; }
    else { penDown = false; t = 'l'; } // pointercancel, pointerleave: out of range
    const b = e.buttons | (e.button === 5 ? 32 : 0); // the eraser end reports button 5
    send(JSON.stringify({ t, pt: 'pen', x, y, p: e.pressure, tx: e.tiltX || 0, ty: e.tiltY || 0, b }));
    return;
  }
  if (e.type === 'pointerleave') return;
  let t;
  if (e.type === 'pointerdown') {
    if (x < 0 || x > 1 || y < 0 || y > 1) return; // tap on the letterbox
    surface.setPointerCapture(e.pointerId); down.add(e.pointerId); t = 'd';
  } else if (!down.has(e.pointerId)) {
    return;
  } else if (e.type === 'pointermove') {
    t = 'm';
  } else {
    down.delete(e.pointerId); t = 'u';
  }
  send(JSON.stringify({ t, id: e.pointerId, x, y }));
}
for (const el of [v, c]) {
  for (const t of ['pointerdown', 'pointermove', 'pointerup', 'pointercancel', 'pointerleave']) el.addEventListener(t, onPointer);
  el.addEventListener('contextmenu', e => e.preventDefault()); // long press
}

// --- keyboard ---
// A hardware keyboard sends physical keys (KeyboardEvent.code): the desktop's
// layout decides what they type. An on-screen keyboard only reports text, so
// it types through a hidden text field and smon maps the text to keys.
const kb = document.getElementById('kb'), kbin = document.getElementById('kbin');
if (KEYBOARD) {
  kb.hidden = false;
  const key = (e, d) => {
    if (document.activeElement === kbin) return; // on-screen keyboard: handled below
    if (e.code === 'Escape' && document.fullscreenElement) return; // the browser leaves fullscreen
    e.preventDefault();
    if (d && e.repeat) return; // the desktop repeats held keys itself
    if (send && e.code) send(JSON.stringify({ t: 'k', c: e.code, d }));
  };
  window.addEventListener('keydown', e => key(e, 1));
  window.addEventListener('keyup', e => key(e, 0));
  kb.onclick = () => { kbin.value = ''; kbin.focus(); };
  const tap = c => { if (send) { send(JSON.stringify({ t: 'k', c, d: 1 })); send(JSON.stringify({ t: 'k', c, d: 0 })); } };
  // Predictive keyboards (Gboard) compose a word and only commit it at the end:
  // composing can't be cancelled, so let it fill the field and send the word once.
  kbin.addEventListener('compositionend', e => {
    if (send && e.data) send(JSON.stringify({ t: 's', s: e.data }));
    setTimeout(() => { kbin.value = ''; });
  });
  kbin.addEventListener('beforeinput', e => {
    if (e.inputType === 'insertCompositionText' || e.isComposing) return;
    e.preventDefault();
    if (!send) return;
    switch (e.inputType) {
      case 'insertText': case 'insertReplacementText': case 'insertFromPaste': {
        const text = e.data ?? e.dataTransfer?.getData('text/plain');
        if (text) send(JSON.stringify({ t: 's', s: text.slice(0, 1024) }));
        break;
      }
      case 'insertLineBreak': case 'insertParagraph': tap('Enter'); break;
      case 'deleteContentBackward': tap('Backspace'); break;
      case 'deleteContentForward': tap('Delete'); break;
    }
  });
  // Keys an on-screen keyboard reports as keys (arrows, Enter on some).
  kbin.addEventListener('keydown', e => {
    if (['Enter', 'Tab', 'Escape', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
      e.preventDefault(); tap(e.code || e.key);
    }
  });
}

// --- toolbar: fullscreen, install (double-tap would be a touch on the desktop) ---
let fsTimer;
function showFs() { bar.classList.add('show'); clearTimeout(fsTimer); fsTimer = setTimeout(() => bar.classList.remove('show'), 3000); }
fs.onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
showFs();

// --- installable app ---
// The service worker keeps this page available while smon is down, so the app
// opens and waits instead of failing. Browsers only allow it on a trusted
// connection: a certificate warning clicked through is not enough.
const inst = document.getElementById('inst'), trust = document.getElementById('trust');
let installPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; inst.hidden = false; showFs(); });
inst.onclick = async () => { if (!installPrompt) return; installPrompt.prompt(); await installPrompt.userChoice; installPrompt = null; inst.hidden = true; };
window.addEventListener('appinstalled', () => { inst.hidden = true; });
document.getElementById('trustx').onclick = e => {
  e.preventDefault(); trust.style.display = 'none';
  try { localStorage.setItem('smon-trust-dismissed', '1'); } catch {}
};
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js' + location.search, { scope: '/' }).catch(() => {
    let dismissed = false;
    try { dismissed = localStorage.getItem('smon-trust-dismissed') === '1'; } catch {}
    if (location.protocol === 'https:' && !dismissed) trust.style.display = 'block';
  });
}

// keep the tablet awake (needs a secure context: HTTPS, or localhost over USB)
async function wake() { try { if (document.visibilityState === 'visible') await navigator.wakeLock?.request('screen'); } catch {} }
document.addEventListener('visibilitychange', wake); wake();

// localhost means adb reverse (TCP only): WebRTC can't get through, WebCodecs must.
if (location.hostname === 'localhost') {
  if ('VideoDecoder' in window) startWS();
  else msg.textContent = 'this browser lacks WebCodecs (VideoDecoder), needed over USB: update it, or use Chrome';
} else {
  run(startRTC);
}
</script>
</html>
